$ITEM_NAME "Wait Time"
 
$ITEM_DESC "Plugin for TesmioLoader/RepublicModLoader allowing you to adjust the in-game time limits for citizens. This includes:

Time spent by citizens waiting at stops/stations for transit (default 1h)
This means that you can provide less frequent transit to citizens at stops on a line. By default, you would need one vehicle per 60 seconds or to juggle them between platforms. Now, you could have rural transit vehicles that arrive much less frequently, and citizens will wait at the stops for them instead of quickly teleporting home.

Time spent by citizens travelling in vehicles (default 4h)
This allows you to have longer travel times without forcibly transferring to another vehicle to exceed the default 4h limit. This makes long-distance but slower travel options more viable. Early Start horse buses are now more viable, as well as other vehicles with low speeds.

Time spent by citizens in their free time (default 16h)
This allows you to increase travel times for citizen needs without negative impacts. Time spent in free time waiting at stops counts towards the timer, so using this mod to extend wait times eats up a lot of free time, affecting satisfaction and happiness. You can counteract this by increasing free time.

Install:
RML - Simply subscribe on the Workshop and check that it is loaded in the menu.
Tesmio - Subscribe and move waittime.dll and waittime.ini into your Tesmio plugins folder.

Please report any bugs or compatibility issues with other mods in the comments.

Github - https://github.com/iosifandreevich81/wait-time-plugin-wrsr

Version 1.0, 7/11/26"
 
$END
