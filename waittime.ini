; waittime - how long citizens wait at stops, ride in vehicles, and spend their free time.
; This file is UTF-8, no BOM.
;
; Read by plugins\waittime.dll, which tesmiomodloader/RML loads out of its plugins
; folder. Deleting the DLL restores the base game exactly; this file only tunes
; the feature. Nothing here changes the save format.
;
; ABOUT THE HOURS
; Every setting below is in the hours the game itself displays for that limit,
; but the game's hours are not all the same length. Counting in normal ticks
; (1 second each), using the station wait as the reference conversion:
;
;   station wait    1 h = 60 ticks     default  1 h =  60 ticks
;   vehicle travel  1 h = 95 ticks     default  4 h = 380 ticks
;   free time       1 h = 11.25FT ticks  default 16 h = 180FT ticks
;   Note: free-time ticks (FT) are 3x longer than standard
;
; So a setting is converted with its own row: vehicle_travel_hours = 8 gives
; 8 x 95 = 760 ticks, and free_time_hours = 32 gives 32 x 11.25 = 360FT ticks.
; The same number of hours therefore means a different length of time in each.

[general]

; 0 leaves the game alone and the plugin unloads without patching anything.
enabled = 1

; How long a citizen waits at a stop / station before giving up.
; Applies to every transport type. Must be greater than 0. Default = 1
station_wait_hours = 1

; The longest a citizen stays in one vehicle before giving up and going home.
; Must be greater than 0. Default = 4
vehicle_travel_hours = 4

; How long a citizen's free time lasts before they head home or to work.
; Must be greater than 0. Default = 16
free_time_hours = 16

; EXPERIMENTAL! Off by default. The in-vehicle timer is also checked against a
; second limit (600 ticks) in some branches of the game's code. Set to 1 to
; scale that limit by the same factor as vehicle_travel_hours. It may also
; affect time spent waiting inside buildings in those branches. Try it only if
; vehicle_travel_hours alone has no visible effect on some vehicles.
scale_secondary_limit = 0

; Log what each patch site holds and what it would become, without changing
; anything. Useful after a game update.
probe = 0
